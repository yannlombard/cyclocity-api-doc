        '200':
          {
            description: OK,
            content:
              {
                application/vnd.renewalOffer.v2+json:
                  { schema: { type: array, items: { type: object } } },
              },
          }

  # ---------------------------------------------------------------- Trajets et statistiques
  /contracts/{contract}/accounts/{accountId}/subscriptions/{subscriptionId}/trips:
    parameters:
      - $ref: '#/components/parameters/contract'
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/subscriptionId'
    post:
      tags: [Trajets et statistiques]
      operationId: unlockBike
      summary: Déverrouiller un vélo
      description: |
        Toutes les valeurs proviennent de `GET /bikes?stationNumber=...`. `{subscriptionId}` = `id` d'un abonnement
        courant non verrouillé. Après le `200`, la borne libère le vélo quelques secondes ; s'il n'est pas retiré,
        elle se reverrouille et aucun trajet n'est créé. L'app polle ensuite `GET .../trips/ongoing` toutes les
        5-10 s. **Action réelle et potentiellement payante.**

        La requête ne porte aucune position : c'est le client qui vérifie, avant l'appel, que l'utilisateur est à
        moins de `bike.release.distance` (200 m) de la station, que le compte n'est pas verrouillé (`isLocked`) et
        que le moyen de paiement est valide (`paymentValid` de `GET .../payment`). L'app Android 3.3.10 n'envoie
        que le `Content-Type`, sans `Accept`. Contrôles, messages par `transactionState` et codes de refus : README § 5.6.
      security: [{ Taknv1: [], Identity: [] }]
      x-status: observed
      requestBody:
        required: true
        content:
          application/vnd.trip.v5+json:
            schema:
              type: object
              required: [stationNumber, bikeNumber, standNumber, typeFrom]
              properties:
                stationNumber: { type: integer, examples: [2002] }
                bikeNumber: { type: integer, examples: [20449] }
                standNumber: { type: integer, examples: [1] }
                typeFrom: { type: string, enum: [SMARTPHONE] }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenIdentity' }
        '200':
          description: >-
            Ordre transmis. Seul `OK` libère le vélo ; `ABORT`, `NOK`, `TIME_OUT` (le point d'attache n'a pas répondu)
            et `NOT_CONNECTED` (aucun vélo sur le point d'attache) sont des échecs rendus avec ce même `200`.
          content:
            application/vnd.trip.v5+json:
              schema:
                type: object
                properties:
                  transactionState:
                    type: string
                    enum: [NOT_CONNECTED, UNKNOW, UNSTARTED, RUNNING, OK, NOK, ABORT, TIME_OUT]
                    examples: [OK]
        '4XX':
          description: >-
            Refus métier, lu dans l'app Android et jamais capturé (statut exact inconnu) :
            `trips.exception.invalid.customer.maxBikesRented` (un autre trajet est en cours),
            `kiwi.exception.customer.rent.time.limit` (délai entre deux courses non écoulé),
            `kiwi.exception.customer.insuffisant.right` (abonnement hors validité),
            `kiwi.exception.customer.paymentmode.not.valid` (moyen de paiement à mettre à jour),
            `kiwi.exception.no.release.bike` (problème technique), `trips.exception.invalid.customer.credit`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /contracts/{contract}/accounts/{accountId}/trips/ongoing:
    parameters:
      - $ref: '#/components/parameters/contract'
      - $ref: '#/components/parameters/accountId'
    get:
      tags: [Trajets et statistiques]
      operationId: getOngoingTrips
      summary: Trajet en cours (`[]` sinon)
      description: "L'app 3.6.1 (sept. 2026) demande `application/vnd.trip.v6+json` ; seules des listes vides ont été observées dans ce type, la shape est supposée identique au v5. Les deux `Accept` répondent `200` (vérifié live le 15/09/2026)."
      security: [{ Taknv1: [], Identity: [] }]
      x-status: live
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenIdentity' }
        '200':
          description: OK
          content:
            application/vnd.trip.v5+json:
              schema: { type: array, items: { $ref: '#/components/schemas/Trip' } }
            application/vnd.trip.v6+json:
              schema: { type: array, items: { $ref: '#/components/schemas/Trip' } }
  /contracts/{contract}/accounts/{accountId}/trips:
    parameters:
      - $ref: '#/components/parameters/contract'
      - $ref: '#/components/parameters/accountId'
    get:
      tags: [Trajets et statistiques]
      operationId: listTrips
      summary: Historique des trajets (les plus récents en premier)
      description: "L'app 3.6.1 (sept. 2026) filtre `?status=FINISHED&status=ERROR&status=REVERSED` et demande `application/vnd.trip.v6+json` ; seules des listes vides ont été observées dans ce type, la shape est supposée identique au v5. Les deux `Accept` et le filtre répondent `200` (vérifié live le 15/09/2026). Les trajets facturés se relisent aussi dans `GET .../sales?infoType=TRIP`."
      security: [{ Taknv1: [], Identity: [] }]
      x-status: live
      parameters:
        - {
            name: status,
            in: query,
            style: form,
            explode: true,
            schema:
              {
                type: array,
                items:
                  {
                    type: string,
                    enum:
                      [REQUESTED, STARTED, FINISHED, REJECTED, TIMEOUT, PAUSED, AUTO_FINISHED, ERROR, WARNING, REVERSED],
                  },
              },
            description: 'Répétable',
          }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenIdentity' }
        '200':
          description: OK
          content:
            application/vnd.trip.v5+json:
              schema: { type: array, items: { $ref: '#/components/schemas/Trip' } }
            application/vnd.trip.v6+json:
              schema: { type: array, items: { $ref: '#/components/schemas/Trip' } }
  /contracts/{contract}/accounts/{accountId}/trips/{tripId}/rate:
    parameters:
      - $ref: '#/components/parameters/contract'
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/tripId'
    post:
      tags: [Trajets et statistiques]
      operationId: rateTripBike
      summary: Noter le vélo d'un trajet (crédite 5 points de fidélité)
      description: |
        L'invitation à noter n'est pas un push : c'est le champ `isRated: false` du trajet, relu au retour dans
        l'app, qui la déclenche. La notation est binaire (`recommended`), possible une seule fois par trajet, et
        crédite la règle `RATE_BIKE` (5 points). En cas de `recommended: false`, `cdrCode` porte le motif choisi
        dans `GET /contracts/{contract}/defect-types?domain=BIKE&category=DECLARED_CUSTOMER&active=true`.

        Route non exercée en capture : méthode, media-type et forme du corps viennent des interfaces Retrofit
        de l'app Android officielle 3.3.10.
      security: [{ Taknv1: [], Identity: [] }]
      x-status: decompiled
      requestBody:
        required: true
        content:
          application/vnd.trip.v5+json:
            schema: { $ref: '#/components/schemas/BikeRate' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenIdentity' }
        '200':
          description: Notation enregistrée (le corps est renvoyé en écho)
          content:
            application/vnd.trip.v5+json:
              schema: { $ref: '#/components/schemas/BikeRate' }
  /contracts/{contract}/accounts/{accountId}/stats:
    parameters:
      - $ref: '#/components/parameters/contract'
      - $ref: '#/components/parameters/accountId'
    get:
      tags: [Trajets et statistiques]
      operationId: getStats
      summary: Statistiques agrégées
      security: [{ Taknv1: [], Identity: [] }]
      x-status: observed
      parameters:
        - {
