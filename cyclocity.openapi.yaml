      responses:
        '200':
          description: OK
          content:
            application/vnd.stats.v1+json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    statsType: { type: string }
                    periodTotal: { type: number }
                    periodicity: { type: string }
                    values: { type: object, additionalProperties: { type: number } }
        '404':
          description: '`stats.exception.stats.not.found`, aucun trajet sur la période'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

