  # ---------------------------------------------------------------- Process
  /contracts/{contract}/accounts/{accountId}/processes:
    parameters:
      - $ref: '#/components/parameters/contract'
      - $ref: '#/components/parameters/accountId'
    post:
      tags: [Process]
      operationId: startProcess
      summary: Lancer un process (souscription, paiement, changement de badge...)
      description: |
        Certains paramètres sont sérialisés en chaînes **préfixées par un type Java** (§ 4.4) :
        `"<[Format:java.lang.Long]>75171"` (offerId, badgeId, kiwiId, bikeModelId),
        `"<[Format:java.util.Date]>1772562420000"` (startDate, subscriptionStart, timestamp ms),
        `"<[Format:java.util.UUID]>..."` (subscriptionId, transactionId, parkingId, deliveryShopId, tripId, saleId).
        Vérifier `inError: false` ; `toResume: true` signifie qu'un `PATCH .../processes/{executionId}` est attendu.
        `parameters` est une map plate sérialisée par Jackson, sans objet typé par process.
        Le paramètre de requête `returns` demande une valeur calculée en retour, rendue dans `results` :
        les parcours selfcare l'utilisent pour obtenir un verdict immédiat (`SELFCARE_TRIP_AMOUNT` et
        `SELFCARE_RETURNED_BIKE` -> `incident_type`, `SELFCARE_RESCIND_SUBSCRIPTION` ->
        `subscription_condition_status`). Voir § 6.3 du README.
      security: [{ Taknv1: [], Identity: [] }]
      x-status: observed
      parameters:
        - {
            name: returns,
            in: query,
            style: form,
            explode: true,
            schema:
              {
                type: array,
                items:
                  { type: string, enum: [incident_type, subscription_condition_status] },
              },
            description: 'Répétable. Lu dans le binaire Android 3.3.10, jamais exercé en capture.',
          }
      requestBody:
        required: true
        content:
          application/vnd.processes.v2+json:
            schema: { $ref: '#/components/schemas/ProcessRequest' }
            examples:
              achatTicket:
                summary: SHORT_TERM_SUBSCRIPTION_V2 (achat d'un ticket 1 trajet, § 6.1)
                value:
                  type: SHORT_TERM_SUBSCRIPTION_V2
                  parameters:
                    platform: MOBILE
                    badgeType: EXTERNAL
                    badgeId: '<[Format:java.lang.Long]>22'
                    offerId: '<[Format:java.lang.Long]>75171'
                    startDate: '<[Format:java.util.Date]>1772562420000'
                    cgauVersion: '003.002'
                    supplements: []
                    optionIds: []
                    optInPartner: false
                    optInSystem: false
                    browserJavaEnabled: true
                    browserTimeZone: -60
                    browserColorDepth: 32
                    browserScreenWidth: 390
                    browserScreenHeight: 844
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenIdentity' }
        '200':
          description: Process exécuté (~3 s pour un achat de ticket)
          content:
            application/vnd.processes.v2+json:
              schema: { $ref: '#/components/schemas/ProcessResult' }
  /contracts/{contract}/accounts/{accountId}/processes/{executionId}:
    parameters:
      - $ref: '#/components/parameters/contract'
      - $ref: '#/components/parameters/accountId'
      - { name: executionId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Process]
      operationId: resumeProcess
      summary: Confirmer / reprendre un process (`toResume`, ex. retour 3-DS)
      security: [{ Taknv1: [], Identity: [] }]
      x-status: declared
      requestBody:
        content:
          application/vnd.processes.v2+json:
            schema: { type: object }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenIdentity' }
        '200':
          description: OK
          content:
            application/vnd.processes.v2+json:
              schema: { $ref: '#/components/schemas/ProcessResult' }
    delete:
      tags: [Process]
      operationId: cancelProcess
      summary: Annuler un process, rapporté par Pikari0
      security: [{ Taknv1: [], Identity: [] }]
      x-status: reported
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenIdentity' }
        '200': { description: OK }

components:
  securitySchemes:
    Taknv1:
      type: apiKey
      in: header
      name: Authorization
      description: '`Authorization: Taknv1 {clientToken}` : client token applicatif (§ 3.1). Requis sur toutes les routes sauf GBFS.'
    Identity:
      type: apiKey
      in: header
      name: Identity
      description: "`Identity: {access_token}` : access token Keycloak de l'utilisateur (realm `vls-default`, § 3.2). Requis sur `/accounts/...`."

  parameters:
    contract:
      name: contract
      in: path
      required: true
      description: Code du contrat (ville). Les 21 contrats sont listés par `GET /contracts` (§ 11).
      schema: { type: string, default: lyon }
      example: lyon
    accountId:
      name: accountId
      in: path
      required: true
      description: UUID du compte (`GET /accounts/{email}/id`), accepté en majuscules ou minuscules.
      schema: { type: string, format: uuid }
    stationNumber:
      name: number
      in: path
      required: true
      schema: { type: integer }
      example: 2002
    stationNumberBookmark:
      name: stationNumber
      in: path
      required: true
      schema: { type: integer }
      example: 2002
    offerId:
      name: offerId
      in: path
      required: true
      schema: { type: integer }
      example: 75171
    badgeId:
      name: badgeId
      in: path
      required: true
      schema: { type: integer }
      example: 22
    groupId:
      name: groupId
      in: path
      required: true
      schema: { type: integer }
      example: 190
    subscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    tripId:
      name: tripId
      in: path
      required: true
      description: UUID du trajet (`id` d'une entrée de `GET .../trips`).
      schema: { type: string, format: uuid }

  requestBodies:
    Device:
      required: true
      content:
        application/vnd.message.v2+json:
          schema:
            type: object
            required: [platform, deviceToken]
            properties:
              platform: { type: string, enum: [IOS, ANDROID] }
              deviceToken: { type: string, description: Token push FCM }

  responses:
    Unauthorized:
      description: 'Header `Authorization: Taknv1 ...` absent ou client token expiré (corps vide ou `Error`).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ForbiddenIdentity:
      description: Page HTML Tomcat, header `Identity` absent/invalide ou `accountId` invalide.

  schemas:
    Error:
      type: object
      description: Format d'erreur standard, doublé du header `Bloot-Error-Code`.
      properties:
        code: { type: string, examples: [stats.exception.stats.not.found] }
        message: { type: string }

    CgauFile:
      type: object
      description: Enveloppe d'un PDF de CGU, même forme que le logo d'un badge ou un reçu de période.
      properties:
        id: { type: string, format: uuid, description: '`documentId` de la version' }
        filename: { type: string, examples: ["20250101_CGAU Vélo'v 2.pdf"] }
        mimeType: { type: string, examples: [application/pdf] }
        translations:
          type: object
          properties:
            id: { type: integer }
            locale: { type: string, examples: [fr] }
            content: { type: string, contentEncoding: base64, description: PDF encodé en base64 }

    Feature:
      type: object
      properties:
        active: { type: boolean }
        name: { type: string }
        description: { type: string }
        parameter:
          type: object
          properties:
            name: { type: string }
            defaultValue: { type: string }
            value: { type: string }

    Contract:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, examples: [lyon] }
        commercialName: { type: string, examples: [Vélov] }
        language: { type: string }
        kiwiName: { type: string }
        currency: { type: string, examples: [EUR] }
        timezone: { type: string, examples: [Europe/Paris] }
        url: { type: string, format: uri }
        type: { type: string, examples: [VLS2] }
        inMaintenance: { type: boolean }
        aliases: { type: array, items: { type: string } }
        contractLanguages:
          type: array
          items:
            type: object
            properties: { locale: { type: string }, defaultLanguage: { type: boolean } }
        geoPosition:
          type: object
          properties: { latitude: { type: string }, longitude: { type: string } }
        features:
          type: array
          items: { $ref: '#/components/schemas/Feature' }

    Document:
      type: object
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        mimeType: { type: string }
        content: { type: string, contentEncoding: base64 }

    TranslatedDocument:
      type: object
      properties:
        id: { type: integer }
        filename: { type: string }
        mimeType: { type: string }
        translations:
          type: object
          properties:
            id: { type: integer }
            locale: { type: string }
            content: { type: string, contentEncoding: base64 }

    Availability:
      type: object
      properties:
        stands: { type: integer }
        bikes:
          type: object
          properties:
            mechanical: { type: integer }
            electrical: { type: integer }
            electricalInternalBattery: { type: integer }
            electricalRemovableBattery: { type: integer }

    Station:
      type: object
      description: '`Accept: application/vnd.station.v4+json`'
      properties:
        id: { type: string, format: uuid }
        contractName: { type: string }
        number: { type: integer }
        name: { type: string, examples: ['2002 - BELLECOUR / ST EXUPÉRY'] }
        open: { type: boolean }
        connected: { type: boolean }
        connectionState: { type: string, examples: [CONNECTED] }
        maintenance: { type: boolean }
        active: { type: boolean }
        furnitureId:
          type: object
          properties:
            { country: { type: integer }, agency: { type: integer }, district: { type: integer } }
        capacity:
          type: object
          properties:
            main: { type: integer }
            overflow: { type: integer, description: Places de la station virtuelle }
        bonus:
          type: boolean
          description: Station bonus, la repose y rapporte des points (règle `TRIP_BONUS`). Aucune à Lyon au 24/09/2026.
        description: { type: string, description: 'Lue par l''app Android 3.3.10 ; absente de la réponse donnée en exemple (§ 5.2)' }
        address: { type: string }
        location:
          type: object
          properties: { latitude: { type: number }, longitude: { type: number } }
        hasShape: { type: boolean, description: 'Vrai quand `shape` décrit la zone de la station virtuelle' }
        shape:
          type: [object, 'null']
          description: Zone de la station virtuelle, lue par l'app Android 3.3.10
          properties:
            vertices:
              type: array
              items:
                type: object
                properties: { latitude: { type: number }, longitude: { type: number } }
        overflow:
          type: boolean
          description: >-
            Station virtuelle (débordement) : des vélos peuvent être rendus hors bornette, dans la zone `shape`.
            Aucune à Lyon au 24/09/2026, où la feature `overflow.enabled` vaut `false`.
        availabilities:
          type: object
          properties:
            main: { $ref: '#/components/schemas/Availability' }
            overflow: { $ref: '#/components/schemas/Availability' }
        lastComm: { type: string }
        paymentTerminal: { type: boolean }
        metricsEnabled: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }

    StationLegacy:
      type: object
      description: Shape renvoyée sans `Accept` versionné.
      properties:
        label: { type: string }
        open: { type: boolean }
        connected: { type: boolean }
        code: { type: integer }
        country: { type: integer }
        agency: { type: integer }
        district: { type: integer }
        nbBikeBases: { type: integer }
        nbBikes: { type: integer }
        bonus: { type: boolean }
        bikes:
          type: array
          description: Présent sur `GET /stations/{number}` uniquement
          items:
            type: object
            properties:
              bikeType: { type: integer }
              bikeBaseNo: { type: integer }
              bikeNo: { type: integer }
              bikeAvailable: { type: boolean }

    Bike:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, description: Numéro à utiliser pour déverrouiller }
        contractName: { type: string }
        type: { type: string, enum: [MECHANICAL, ELECTRICAL] }
        frameId: { type: string, description: Numéro de cadre }
        stationNumber:
          {
            type: integer,
            description: '`101010` = hors station (feature `bike.station.disabled`)',
          }
        standNumber: { type: integer }
        status:
          type: string
          enum:
            [
              AVAILABLE,
              RENTED,
              RESERVED,
              REGULATION,
              OUTSIDE_STATION,
              NOT_RECOGNIZED,
              MAINTENANCE,
              MAINTENANCE_HEAVY,
              TO_BE_REPARED,
              NEW_BIKE_IN_STOCK,
              AVAILABLE_IN_STOCK,
              TRANSFERRED,
              DISMANTLED,
              DESTROYED,
              STOLEN,
              SCRAPPED,
              DELETED,
            ]
        statusLabel: { type: string }
        hasBattery: { type: boolean }
        hasLock:
          type: boolean
          description: Toujours `false` sur le parc lyonnais (relevé du 23/09/2026) ; l'app Android le lit avec `lock`, sans l'afficher
        lock:
          type: object
          description: Cadenas connecté, lu par l'app Android mais jamais affiché ; absent à Lyon
          properties:
            latitude: { type: number }
            longitude: { type: number }
            batteryPercentage: { type: integer }
        battery:
          type: object
          description: Vélos électriques uniquement
          properties:
            percentage:
              type: number
              description: Charge en %, mais des valeurs de 2 059 à 3 691 existent (surtout sur `REMOVABLE`), vraisemblablement une tension en mV ; écarter toute valeur hors de 0-100. Aucun client officiel ne le lit
            type:
              type: string
              enum: [INTERNAL, REMOVABLE]
              description: Les clients officiels n'affichent la batterie que d'un vélo `INTERNAL`
            level:
              type: integer
              description: Palier calculé, `ceil(percentage / 25)` ; 0 à 4 pour un pourcentage valide. L'app Android affiche une pile en erreur à partir de 5
        rating:
          type: object
          description: |
            Note des usagers **depuis le dernier contrôle** (`lastControlDateTime`) : elle
            repart de zéro à chaque passage en atelier (déduit, README § 5.6). `count: 0` sans
            les autres champs pour un vélo jamais noté depuis.
          properties:
            {
              value:
                {
                  type: number,
                  description: 'Moyenne de votes valant chacun 100 (recommandé), 60 ou 30 (déconseillé) ; pas un pourcentage de recommandation',
                },
              count: { type: integer },
              lastRatingDateTime: { type: string },
            }
        checked:
          type: boolean
          description: Vélo contrôlé sans aucun avis depuis ; affiché « Révisé » par les clients officiels, à la place de la note. Tombe au premier avis (déduit, README § 5.6)
        createdAt: { type: string }
        updatedAt: { type: string }
        isReserved:
          type: boolean
          description: Ne recoupe pas le statut `RESERVED` (880 vélos `true` le 23/09/2026, surtout `RENTED` et `AVAILABLE`, pour un seul `RESERVED`) ; sens non établi, lu par aucun client. `bikes.v4` seulement
        energySource:
          type: integer
          description: '`0` mécanique, `1` ou `2` électrique ; absent sur les vélos à batterie `REMOVABLE` (e-Vélo''v à batterie amovible). `bikes.v4` seulement, lu par aucun client'
        lastTripDateTime:
          type: string
          description: Dernier trajet ; le seul champ qui dise si le vélo roule vraiment (`status` garde des fiches dormantes)
        lastControlDateTime:
          type: string
          description: Dernier contrôle en atelier ; remet `rating` à zéro
        nextCheck:
          type: string
          description: Contrôle suivant, fixé à `lastControlDateTime` + 5 jours
        lastRevisionDateTime:
          type: string
          description: Dernière révision complète
        nextReview:
          type: string
          description: Révision suivante, fixée à `lastRevisionDateTime` + 730 jours
        lastDataFrameDate: { type: string }
        bikeBatteryMv: { type: integer }
        bikeTopSwVersion: { type: string }
        bikeTopHwVersion: { type: string }
        zedSwVersion: { type: string }

    Account:
      type: object
      description: '`Accept: application/vnd.account.v4+json`'
      properties:
        type: { type: string, enum: [END_USER, ENTERPRISE, VIP] }
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        createdAt: { type: string }
        updatedAt: { type: string }
        contractCode: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        sex: { type: string }
        phoneNumber: { type: string }
        birthDate: { type: string, format: date }
        address:
          type: object
          properties: { name: { type: string }, complement: { type: string } }
        zipCode: { type: string }
        city: { type: string }
        country: { type: string }
        defaultLocale: { type: string }
        optInSystem: { type: string, enum: [UNSEEN, SEEN, ACTIVATED] }
        optInPartner: { type: string, enum: [UNSEEN, SEEN, ACTIVATED] }
        children: { type: array, items: { type: object } }
        completion: { type: number, minimum: 0, maximum: 1 }
        paymentInfosId: { type: string, format: uuid }
        stations: { type: array, items: { type: integer }, description: Stations favorites }
        isAnonymous: { type: boolean }
        isLocked: { type: boolean }
        tags: { type: array, items: { type: string } }

    Badge:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        type: { type: string, enum: [OWNER, EXTERNAL, TICKET, NO_BADGE] }
        paymentMethods: { type: array, items: { type: string } }
        validityStart: { type: string, format: date }
        ratePlanId: { type: string, format: uuid }
        amountReedit: { type: integer }
        isControlledPlugIn: { type: boolean }
        badgeOrder: { type: integer }
        canBeOrdered: { type: boolean }
        proofIds: { type: array, items: { type: integer } }

    Offer:
      type: object
      description: '`Accept: application/vnd.offer.v2+json` : prix en centimes ; `duration` en jours (`IMMEDIATE`) ou en mois (`MONTHLY`)'
      properties:
        accountType: { type: string }
        id: { type: integer }
        contractCode: { type: string }
        title: { type: string }
        description: { type: string }
        shortDescription: { type: string }
        duration: { type: integer }
        invoicingLag: { type: integer }
        price: { type: integer }
        type: { type: string, enum: [ST, LT, CT, VU, UB, BATTERY, PARKING] }
        validityStart: { type: string, format: date }
        badges: { type: array, items: { $ref: '#/components/schemas/Badge' } }
        hasCampaigns: { type: boolean }
        platforms: { type: array, items: { type: string, enum: [MOBILE, WEB, PRIVATE, TERMINAL] } }
        paymentMethods: { type: array, items: { type: string } }
        paymentFrequency: { type: string, enum: [IMMEDIATE, MONTHLY] }
        proofs: { type: array, items: { type: object } }
        renewal:
          type: object
          properties:
            isAuto: { type: boolean }
            isManual: { type: boolean }
            defaultIsAuto: { type: boolean }
            defaultIsManual: { type: boolean }
            earlyPeriod: { type: integer }
            expiredRenewalPeriod: { type: integer }
            manualOffers: { type: array, items: { type: integer } }
            autoOffers: { type: array, items: { type: integer } }
        nbTickets: { type: integer }
        optionIds: { type: array, items: { type: integer } }
        relatedOffers: { type: array, items: { type: integer } }
        offersMigration: { type: array, items: { type: integer } }
        creditedOffer: { type: boolean }
        supplementIds: { type: array, items: { type: integer } }
        ageMin: { type: [integer, 'null'] }
        ageMax: { type: [integer, 'null'] }

    Package:
      type: object
      description: Devis renvoyé par `POST .../packages` (aucun débit).
      properties:
        offerId: { type: integer }
        subtypeKiwiId: { type: integer }
        initialPrice: { type: integer }
        reductionAmount: { type: integer }
        finalPrice: { type: integer }
        optionOnlinePrice: { type: integer }
        optionShopPrice: { type: integer }
        subscriptionEndDate: { type: string }
        isBlocking: { type: boolean }
        paymentMethods: { type: array, items: { type: string } }
        deferreds: { type: array, items: { type: object } }
        deferredsShop: { type: array, items: { type: object } }
        sight: { type: object }
        supplements: { type: array, items: { type: object } }
        itemSales:
          type: array
          items:
            type: object
            properties:
              amount: { type: integer }
              nature: { type: string }
              date: { type: string }
              direction: { type: string, enum: [DEBIT, CREDIT] }

    SubscriptionStatus:
      type: object
      properties:
        value:
          type: string
          enum:
            [
              BADGE_WAITING_ASSOCIATION,
              BADGE_WAITING_MANDATORY_ASSOCIATION,
              BADGE_TEMPORARY_ASSOCIATED,
              EXPIRED,
              CLOSED,
              NOT_VALID_YET,
              INCOMPLETE_FILE,
              ADDRESS_EMPTY,
              BADGE_ORDER_IN_PROGRESS,
            ]
        locking: { type: boolean, description: Bloque l'usage }

    Subscription:
      type: object
      description: '`Accept: application/vnd.subscription.v6+json`'
      properties:
        id: { type: string, format: uuid }
        externalRef: { type: string, description: Identifiant Kiwi (`kiwiId`) }
        externalSrc: { type: string, examples: [KIWI] }
        displayRef: { type: string, description: Référence courte affichée (4 caractères) }
        accountEmail: { type: string }
        accountId: { type: string, format: uuid }
        contractCode: { type: string }
        type: { type: string, enum: [ST, LT, UB, BATTERY, PARKING] }
        badgeId: { type: integer }
        periods:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              subscriptionId: { type: string, format: uuid }
              offerId: { type: integer }
              renewalDetails:
                type: object
                properties:
                  autoRenewalValue: { type: boolean }
                  autoRenewalBtn: { type: boolean }
                  autoRenewalMsg: { type: boolean }
                  manuRenewalBtn: { type: boolean }
              validityStart: { type: string }
              validityEnd: { type: string }
              platform: { type: string }
              subscriptionOptions: { type: object }
              createdAt: { type: string }
              updatedAt: { type: string }
        statuses: { type: array, items: { $ref: '#/components/schemas/SubscriptionStatus' } }
        isLocked: { type: boolean }

    Trip:
      type: object
      description: '`Accept: application/vnd.trip.v5+json` (l''app 3.6.1 demande `v6`, shape non observée) : `duration` en minutes arrondies au supérieur ; `bikeType` 0 = mécanique, 1 = électrique ; `origin` 4 = smartphone'
      properties:
        id: { type: string, format: uuid }
        movementRef: { type: string }
        subscriptionId: { type: string, format: uuid }
        subscriptionRef: { type: string }
        contractName: { type: string }
        accountId: { type: string, format: uuid }
        status:
          {
            type: string,
            enum:
              [
                REQUESTED,
                STARTED,
                FINISHED,
                REJECTED,
                TIMEOUT,
                PAUSED,
                AUTO_FINISHED,
                ERROR,
                WARNING,
                REVERSED,
              ],
          }
        bikeNumber: { type: integer }
        startDateTime: { type: string }
        startStation: { type: integer }
        startStand: { type: integer }
        endDateTime: { type: string }
        endStation: { type: integer }
        endStand: { type: integer }
        duration: { type: integer }
        rewardsEarned: { type: integer }
        rewardsSpent: { type: integer }
        price: { type: integer }
        discount: { type: integer }
        reducedPrice: { type: integer }
        litigious: { type: boolean }
        isSpecial: { type: boolean }
        isRated: { type: boolean, description: '`false` -> l''app propose de noter le vélo' }
        token: { type: string, description: Code du trajet }
        bikeType: { type: integer, enum: [0, 1] }
        origin: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }

    BikeRate:
      type: object
      description: Corps et écho de `POST .../trips/{tripId}/rate`.
      required: [bikeId, recommended, contract]
      properties:
        bikeId:
          type: integer
          description: '**Numéro** du vélo (`bikeNumber` du trajet), pas son UUID'
          examples: [20449]
        recommended:
          type: boolean
          description: Notation binaire (« Je recommande ce vélo » / « Je déconseille ce vélo »)
        contract: { type: string, examples: [lyon] }
        cdrCode:
          type: [string, 'null']
          description: |
            Motif, uniquement si `recommended: false` ; `cdrCode` d'une entrée de
            `GET /contracts/{contract}/defect-types`. `null` sinon.

    DefectType:
      type: object
      description: 'Motif de défaut signalable, `Accept: application/vnd.defect-type.v1+json`.'
      properties:
        id: { type: string, format: uuid }
        rating: { type: integer }
        order: { type: integer }
        cdrCode:
          type: string
          description: |
            Code repris tel quel dans `BikeRate.cdrCode`. Aucun libellé n'accompagne l'entrée : l'app
            officielle n'affiche qu'une icône par code. Sept sont nommés dans son binaire —
            `DT_DECLARED_312` éclairage, `313` roue ou pneu, `314` freins, `315` pédales, `316` guidon,
            `317` selle, `441` autre — et au moins un huitième existe (assistance électrique), pris par
            la branche par défaut du mapping. Prévoir un repli pour un code inconnu.
          examples: [DT_DECLARED_313]
        isElectricBike: { type: boolean, description: Motif réservé aux vélos électriques }

    CreateBooking:
      type: object
      description: Corps de `POST .../bookings` (README § 5.9).
      required: [stationId, stationNumber, standNumber, subscriptionId, bikeId]
      properties:
        stationId:
          type: string
          format: uuid
          description: '`id` de la station (`GET /stations/{n}`), pas son numéro'
        stationNumber: { type: integer, examples: [2002] }
        standNumber: { type: integer, examples: [12] }
        subscriptionId:
          type: string
          format: uuid
          description: Abonnement ST ou LT en cours, non verrouillé
        bikeId:
          type: string
          format: uuid
          description: '`id` du vélo (`GET /bikes`), pas son numéro'

    Booking:
      type: object
      description: Une réservation, rendue par `POST` et listée par `GET .../bookings`.
      properties:
        id: { type: string, format: uuid }
        contractName: { type: string, examples: [lyon] }
        accountId: { type: string, format: uuid }
        subscriptionId: { type: string, format: uuid }
        stationId: { type: string, format: uuid }
        stationNumber: { type: integer, examples: [2002] }
        standNumber: { type: integer, examples: [12] }
        bikeId: { type: string, format: uuid }
        endTime:
          type: string
          description: |
            Fin de la réservation. Format jamais capturé ; probablement la convention des autres dates
            (ISO 8601 sans fuseau, heure locale du contrat).
          examples: ['2026-03-02T09:47:14']

    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        contractCode: { type: string }
        accountEmail: { type: string }
        accountId: { type: string, format: uuid }
        status: { type: string, examples: [PAID] }
        nature: { type: string, enum: [SUBSCRIPTION, RENEWAL, CONSUMPTION, CONSUMPTION_REDUCTION] }
        amount: { type: integer, description: Centimes }
        pankey: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
        offerId: { type: integer }
        paymentRef: { type: string }
        paymentProvider: { type: string, examples: [CB_OGONE] }
        submissionNumber: { type: integer }
        paybackAmount: { type: integer }

    Sale:
      type: object
      properties:
        id: { type: string, format: uuid }
        contractCode: { type: string }
        accountId: { type: string, format: uuid }
        accountEmail: { type: string }
        subscriptionId: { type: string, format: uuid }
        externalRef: { type: string }
        nature: { type: string, enum: [SUBSCRIPTION, RENEWAL, CONSUMPTION, CONSUMPTION_REDUCTION] }
        date: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
        amount: { type: integer }
        direction: { type: string, enum: [DEBIT, CREDIT] }
        status: { type: string, examples: [PAID], description: 'Filtre `GET /sales` : PAID, TO_INVOICE, TO_CONTROL' }
        transactionId: { type: string, format: uuid }
        subscriptionType: { type: string }
        pankey: { type: string }
        accountType: { type: string }
        platform: { type: string, description: 'Présent sur les ventes de période (`MOBILE`, `WEB`...)' }
        paybackAmount: { type: integer }
        saleAdditionnalInfo:
          type: object
          description: 'Présent sur `GET /sales` (pas dans `sales[]` du détail de transaction). `type: TRIP` -> `additionalInfos` est le trajet facturé ; `type: PERIOD` -> `additionalInfos: { periodId }`'
          properties:
            id: { type: string, description: '`movementRef` du trajet ou `periodId`' }
            type: { type: string, enum: [TRIP, PERIOD] }
            additionalInfos:
              oneOf:
                - allOf:
                    - $ref: '#/components/schemas/Trip'
                    - type: object
                      description: 'Champs absents de `GET /trips`'
                      properties:
                        startStationName: { type: string }
                        endStationName: { type: string }
                        elecTripsNb: { type: integer }
                        overchargeAmount: { type: integer, description: Centimes }
                        overchargeMaxTrips: { type: integer }
                - type: object
                  properties: { periodId: { type: string, format: uuid } }

    Rewards:
      type: object
      properties:
        contractName: { type: string }
        accountId: { type: string, format: uuid }
        balance: { type: integer }
        autoSpend: { type: boolean }
        total: { type: integer }
        friendsInvitedCount: { type: integer }

    RewardHistoryEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        accountRewardId: { type: string, format: uuid }
        nature: { type: string, enum: [RULE_ACHIEVED, CONSUMPTION] }
        direction: { type: string, enum: [CREDIT, DEBIT] }
        amount: { type: integer, description: Points }
        reason:
          {
            type: string,
            description: '`name` de la règle (`RATE_BIKE`...) pour un crédit, `REDUCTION` pour un débit',
            examples: [RATE_BIKE, REDUCTION],
          }
        reference: { type: string, description: 'Id du trajet pour un débit ; la chaîne `"null"` pour un crédit de règle' }
        referenceType: { type: string, enum: [TRIP] }
        createdAt: { type: string }
        updatedAt: { type: string }
        readStatus: { type: string, examples: [NOT_APPLICABLE] }

    RewardHistoryPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/RewardHistoryEntry' } }
        totalElements: { type: integer }
        totalPages: { type: integer }
        size: { type: integer, examples: [200] }
        number: { type: integer }
        numberOfElements: { type: integer }
        first: { type: boolean }
        last: { type: boolean }

    ProcessRequest:
      type: object
      required: [type, parameters]
      properties:
        type:
          type: string
          enum:
            [
              SHORT_TERM_SUBSCRIPTION_V2,
              LONG_TERM_SUBSCRIPTION_V2,
              MANUAL_RESUBSCRIPTION_V2,
              CHANGE_BADGE,
              REGISTER_CB,
              REGISTER_ADP,
              REGISTER_PAYMENT_METHOD,
              ADP_SUBSCRIPTION,
              INVOICE_TRANSACTION,
              BATTERY_SUBSCRIPTION,
              VLD_SUBSCRIPTION,
              VLD_RESUBSCRIPTION,
              PARKING_SUBSCRIPTION,
              PARKING_RESUBSCRIPTION,
              ACCOUNT_UNSUBSCRIBE,
              STATION_SUBSCRIPTION,
              CREATE_BIKE_DEFECT,
              CREATE_CAB,
              CREATE_SALESFORCE_CASE,
              SELFCARE_RETURNED_BIKE,
              SELFCARE_TRIP_AMOUNT,
              SELFCARE_RESCIND_SUBSCRIPTION,
              REDEFINE_ACCOUNT_EMAIL,
              CREATE_SPONSORSHIP_PROMOCODE,
            ]
        parameters:
          type: object
          description: Paramètres obligatoires selon le type (§ 6) ; identifiants sérialisés avec préfixe de type (§ 4.4).
          additionalProperties: true

    ProcessResult:
      type: object
      properties:
        executionId: { type: integer }
        type: { type: string }
        inError: { type: boolean }
        toResume: { type: boolean }
        startTime: { type: string }
        endTime: { type: string }
        results:
          type: object
          description: 'Valeurs demandées par `?returns=`. Ex. `{ "incident_type": "PAID_AND_NO_INCIDENT" }` — rendu en clair, sans préfixe de format. Vide sans `returns`.'
        error:
          type: object
          description: "Présent quand `inError: true` (📱, non exercé)."
          properties:
            type: { type: string }
            message: { type: string }
            complement: { type: string }
