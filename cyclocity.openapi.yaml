openapi: 3.1.0
info:
  title: API Cyclocity (Vélo'v Lyon), spécification communautaire non officielle
  version: 2026.09.1
  summary: Reverse-engineering de api.cyclocity.fr tel qu'utilisé par l'app Vélo'v officiel (iOS 3.3.1, puis 3.6.1) et velov.grandlyon.com.
  description: |
    Spécification **partielle et non officielle** dérivée de `README.md` (captures réseau
    fév.-mars et sept. 2026, vérifications live du 18/08/2026). Elle couvre les endpoints observés (✅) et les
    principaux endpoints déclarés dans le front web (🌐). Rien n'est supporté par JCDecaux ni par la
    Métropole de Lyon ; les endpoints, clés et formats peuvent changer sans préavis.

    **Deux tokens cumulatifs** :
    - `Authorization: Taknv1 {clientToken}`, obtenu par `POST /auth/environments/PRD/client_tokens` (2 h) ;
    - `Identity: {keycloakAccessToken}`, access token OIDC de `https://iam.cyclocity.fr/realms/vls-default`
      (15 min), requis sur tout ce qui touche à un compte. Le flow Keycloak (PKCE + formulaire `device_id`)
      est décrit au § 3.2 de la documentation ; il n'est pas modélisé ici.

    **Négociation de contenu** : la plupart des ressources exigent un `Accept` versionné
    (`application/vnd.{ressource}.v{n}+json`) ; sans lui, `406`/`415` ou une shape legacy.

    Extension `x-status` sur chaque opération : `observed` (✅ capture), `live` (✅ vérifié par requête
    directe), `declared` (🌐 front web), `decompiled` (📱 lu dans les interfaces Retrofit de l'app Android
    officielle 3.3.10, non exercé en capture), `reported` (📚 Pikari0 / 🧩 VLSKit, non revérifié).

    Utilisez uniquement **votre propre compte** et respectez les CGU du service. Pour les seules
    stations/disponibilités, préférez l'open data officiel (GBFS servi sans authentification).
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/deed.fr
  contact:
    name: Yann Lombard, dépôt cyclocity-api-doc (README.md, issues, PR)
    url: https://github.com/yannlombard/cyclocity-api-doc

servers:
  - url: https://api.cyclocity.fr
    description: Production (seul environnement observé, `PRD`)

tags:
  - name: Auth
    description: Client token applicatif (`Taknv1`). L'identité utilisateur vient de Keycloak (voir description générale).
  - name: Contrat
    description: Métadonnées, features, contenus, FAQ, CGU du contrat.
  - name: Stations et vélos
    description: Détail temps réel des stations et inventaire des vélos (statuts, batterie).
  - name: Open data (GBFS)
    description: Flux GBFS 2.3 / 3.0 servis par l'API **sans aucune authentification**.
  - name: Compte
    description: Profil, alertes, CGU, favoris, appareils push (`Identity` requis).
  - name: Offres et badges
    description: Catalogue des offres, groupes d'offres, badges (supports d'accès), devis.
  - name: Abonnements
    description: Abonnements du compte, statuts, reçus PDF.
  - name: Trajets et statistiques
    description: Déverrouillage, trajet en cours, historique, statistiques agrégées.
  - name: Paiement
    description: Moyen de paiement, solde, transactions, checkout Worldline.
  - name: Récompenses
    description: Programme fidélité (points, règles).
  - name: Process
    description: Moteur générique pour les opérations transactionnelles (souscription, paiement, changement de badge).

security:
  - Taknv1: []

paths:
  # ---------------------------------------------------------------- Auth
  /auth/environments/PRD/client_tokens:
    post:
      tags: [Auth]
      operationId: createClientToken
      summary: Obtenir un client token (Taknv1)
      description: |
        Le couple `code`/`key` est une constante des clients officiels (non liée à un compte). Celui du site
        web est public (dans le bundle Angular) : `vls.web.lyon:PRD`. Le token dure 2 h ; le `refreshToken`
        permet de le renouveler via `POST /auth/access_tokens`.
      security: []
      x-status: observed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, key]
              properties:
                code: { type: string, examples: ['vls.web.lyon:PRD'] }
                key: { type: string, description: 'Clé publique du front (hex, 64 caractères)' }
      responses:
        '200':
          description: Token créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    { type: string, description: 'JWT RS256, payload zlib-compressé (`zip: DEF`)' }
                  refreshToken: { type: string, format: uuid }
  /auth/access_tokens:
    post:
      tags: [Auth]
      operationId: refreshClientToken
      summary: Renouveler le client token
      security: []
      x-status: observed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, format: uuid }
      responses:
        '200':
          description: Nouveau token (le refresh token reste le même)
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
        '401':
          description: '`auth.error.token.expiredRefreshToken` -> refaire `POST /auth/environments/PRD/client_tokens`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------- Contrat
  /contracts:
    get:
      tags: [Contrat]
      operationId: listContracts
      summary: Liste des 21 contrats de la plateforme (objets complets, features incluses)
      x-status: live
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Contract' }
  /contracts/{contract}:
    parameters: [{ $ref: '#/components/parameters/contract' }]
    get:
      tags: [Contrat]
      operationId: getContract
      summary: Métadonnées du contrat + features (175 sur Lyon)
      x-status: observed
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contract' }
  /contracts/{contract}/features:
    parameters: [{ $ref: '#/components/parameters/contract' }]
    get:
      tags: [Contrat]
      operationId: listFeatures
      summary: Les features seules
      x-status: observed
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Feature' }
  /contracts/{contract}/features/{name}:
    parameters:
      - $ref: '#/components/parameters/contract'
      - {
          name: name,
          in: path,
          required: true,
          schema: { type: string },
          example: default.short.term.offer.id,
        }
    get:
      tags: [Contrat]
      operationId: getFeature
      summary: Une feature
      x-status: live
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feature' }
  /contracts/{contract}/sponsoring:
    parameters: [{ $ref: '#/components/parameters/contract' }]
    get:
      tags: [Contrat]
      operationId: listSponsoring
      summary: Bannières / splash screen
      x-status: observed
      parameters:
        - { name: active, in: query, schema: { type: boolean } }
        - { name: platform, in: query, schema: { type: string, enum: [WEB, MOBILE] } }
        - { name: type, in: query, schema: { type: string, enum: [BANNER, WELCOME_IMAGE] } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Sans filtre, tout l'historique (55 entrées)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    contractCode: { type: string }
                    platform: { type: string }
                    type: { type: string }
                    documentId: { type: string, format: uuid }
                    active: { type: boolean }
                    link: { type: string }
                    clickable: { type: string, enum: [YES, 'NO'] }
                    color: { type: string }
                    colorBtn: { type: string }
                    createdAt: { type: string }
                    updatedAt: { type: string }
  /contracts/{contract}/assets/{documentId}:
    parameters:
      - $ref: '#/components/parameters/contract'
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Contrat]
      operationId: getAsset
      summary: Asset (image...) en base64
      x-status: observed
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/vnd.document.v3+json:
              schema: { $ref: '#/components/schemas/Document' }
  /contracts/{contract}/shops:
    parameters: [{ $ref: '#/components/parameters/contract' }]
    get:
      tags: [Contrat]
      operationId: listShops
      summary: Points de vente physiques
      x-status: observed
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/vnd.shop.v1+json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    contractName: { type: string }
                    name: { type: string }
                    address:
                      type: object
                      properties:
                        street: { type: string }
                        zipCode: { type: string }
                        city: { type: string }
                        country: { type: string }
                    businessHours: { type: array, items: { type: object } }
                    services: { type: array, items: { type: object } }
                    status: { type: string, enum: [OPEN, CLOSED] }
                    content: { type: array, items: { type: object } }
                    updatedAt: { type: string }
  /contracts/{contract}/events:
    parameters: [{ $ref: '#/components/parameters/contract' }]
    get:
      tags: [Contrat]
      operationId: listEvents
      summary: Événements stations (fermetures, travaux), page Spring
      x-status: observed
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 100 } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        type: { type: string, enum: [CLOSING] }
                        nature: { type: string, enum: [WORKS, DETERIORATION] }
                        startDate: { type: string }
                        endDate: { type: string }
                        highPriority: { type: boolean }
                        stations:
                          type: array
                          items:
                            {
                              type: object,
                              properties: { code: { type: integer }, label: { type: string } },
                            }
                        content:
                          type: object
                          properties:
                            {
                              language: { type: string },
                              title: { type: string },
                              description: { type: string },
                            }
                  totalPages: { type: integer }
                  totalElements: { type: integer }
                  size: { type: integer }
                  number: { type: integer }
  /contracts/{contract}/topics:
    parameters: [{ $ref: '#/components/parameters/contract' }]
    get:
      tags: [Contrat]
      operationId: listTopics
      summary: 'Topics de FAQ (Lyon : RIDE, ABO, PAY, REWARDS)'
      x-status: live
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/vnd.topic.v2+json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    {
                      id: { type: integer },
                      code: { type: string },
                      contractName: { type: string },
                    }
  /contracts/{contract}/faqs/search:
    parameters: [{ $ref: '#/components/parameters/contract' }]
    post:
      tags: [Contrat]
      operationId: searchFaqs
      summary: FAQ d'un topic (`GET /faqs` -> 405)
      description: "Réponses en texte brut, `language: \"fr\"` seulement ; 35 questions sur Lyon au 16/09/2026 (`RIDE` 10, `ABO` 20, `PAY` 5, `REWARDS` 0). Rendue par le site (page tutoriels et espace client) ; aucune session Charles ne montre un client appeler cet endpoint, et le menu « Besoin d'aide » de l'app ne l'affiche pas."
      x-status: observed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language, code]
              properties:
                language: { type: string, examples: [fr] }
                code: { type: string, examples: [RIDE] }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    topicId: { type: integer }
                    topicCode: { type: string }
                    contractName: { type: string }
                    rank: { type: integer }
                    contents:
                      type: array
                      items:
                        type: object
                        properties:
                          {
                            question: { type: string },
                            response: { type: string },
                            language: { type: string },
                          }
  /contracts/{contract}/cgau/{type}/valid:
    parameters:
      - $ref: '#/components/parameters/contract'
      - {
          name: type,
          in: path,
          required: true,
          schema: { type: string, enum: [VLS, VLD, PARKING] },
        }
    get:
      tags: [Contrat]
      operationId: getValidCgau
      summary: Version valide des CGU d'un type (à renvoyer dans les process, `cgauVersion`)
      x-status: observed
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/vnd.cgau.v2+json:
              schema:
                type: object
                properties:
                  version: { type: string, examples: ['003.002'] }
                  type: { type: string }
                  amendmentLevel: { type: string, enum: [MINOR, MAJOR] }
                  validityStart: { type: string, format: date }
                  isValid: { type: boolean }
                  documentId: { type: string, format: uuid }
  /contracts/{contract}/cgau/{type}/valid/file:
    parameters:
      - $ref: '#/components/parameters/contract'
      - {
          name: type,
          in: path,
          required: true,
          schema: { type: string, enum: [VLS, VLD, PARKING] },
        }
    get:
      tags: [Contrat]
      operationId: getValidCgauFile
      summary: PDF des CGU valides d'un type, en base64 dans une enveloppe JSON
      description: >-
        Pas de PDF brut : le document est dans `translations.content` (base64). `Accept:
        application/vnd.cgau.v2+json` est exigé ; sans `Accept` ou avec `*/*` -> `415`, avec
        `application/json` ou `application/pdf` -> `406`. Sans client token -> `403 role.not.allowed`.
        Même réponse sur `/cgau/{type}/versions/{version}/file`.
      x-status: live
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/vnd.cgau.v2+json:
              schema: { $ref: '#/components/schemas/CgauFile' }
        '406': { description: '`Accept` autre que `application/vnd.cgau.v2+json` (page HTML Tomcat)' }
        '415': { description: '`Accept` absent ou `*/*` (page HTML Tomcat)' }
  /contracts/{contract}/cgau/{type}/versions/{version}/file:
    parameters:
      - $ref: '#/components/parameters/contract'
      - {
          name: type,
          in: path,
          required: true,
          schema: { type: string, enum: [VLS, VLD, PARKING] },
        }
      - { name: version, in: path, required: true, schema: { type: string, examples: ['003.002'] } }
    get:
      tags: [Contrat]
      operationId: getCgauVersionFile
      summary: PDF d'une version donnée des CGU (même enveloppe que `.../valid/file`)
      x-status: live
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/vnd.cgau.v2+json:
              schema: { $ref: '#/components/schemas/CgauFile' }
  /contracts/{contract}/cgau:
    parameters: [{ $ref: '#/components/parameters/contract' }]
    get:
      tags: [Contrat]
      operationId: listCgau
      summary: Toutes les versions des CGU
      x-status: live
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/vnd.cgau.v2+json:
              schema: { type: array, items: { type: object } }
  /contracts/{contract}/campaigns:
    parameters: [{ $ref: '#/components/parameters/contract' }]
    get:
      tags: [Contrat]
      operationId: listCampaigns
      summary: Campagnes promotionnelles (36 sur Lyon, dont des codes génériques)
      x-status: live
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    name: { type: string }
                    campaignType: { type: string, enum: [UNIQUE, GENERIC] }
                    promotionType: { type: string, enum: [PERCENTAGE, FIX_AMOUNT] }
                    discount: { type: number }
                    genericPromoCode:
                      type: object
                      properties:
                        {
                          id: { type: integer },
                          value: { type: string },
                          lastUpdate: { type: string },
                        }
                    validityStart: { type: string }
                    validityEnd: { type: string }
                    offersIds: { type: array, items: { type: integer } }
                    friend: { type: boolean }
                    sponsorship: { type: boolean }
  /contracts/{contract}/defect-types:
    parameters: [{ $ref: '#/components/parameters/contract' }]
    get:
      tags: [Contrat]
      operationId: listDefectTypes
      summary: 'Types de défauts signalables (exige `Accept: application/vnd.defect-type.v1+json`)'
      description: |
        Alimente le motif d'une notation négative : c'est le `cdrCode` de l'entrée retenue qui part dans le
        corps de `POST .../trips/{tripId}/rate`. `category=DECLARED_CUSTOMER` correspond à ce que déclare un
        client, `DECLARED_AGENT` à ce que saisit un agent.
      x-status: decompiled
      parameters:
        - {
            name: domain,
            in: query,
            schema: { type: string, enum: [BIKE, STAND, STATION, UNKNOWN] },
          }
        - {
            name: category,
            in: query,
            schema: { type: string, enum: [DECLARED_CUSTOMER, DECLARED_AGENT] },
          }
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/vnd.defect-type.v1+json:
              schema: { type: array, items: { $ref: '#/components/schemas/DefectType' } }

  # ---------------------------------------------------------------- Stations et vélos
  /contracts/{contract}/stations:
    parameters: [{ $ref: '#/components/parameters/contract' }]
    get:
      tags: [Stations et vélos]
      operationId: listStations
      summary: Toutes les stations
      description: |
        Sans `Accept` versionné -> shape legacy `[{ label, open, connected, code, country, agency, district,
        nbBikeBases, nbBikes, bonus }]` (inclut des stations de test). Avec `vnd.station.v4` et `?bonus=true`
        -> `[]` sur Lyon. Pour la carte, préférez le GBFS (§ 10) ou l'API JCDecaux v3.
      x-status: live
      parameters:
        - { name: bonus, in: query, schema: { type: boolean } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/StationLegacy' } }
            application/vnd.station.v4+json:
              schema: { type: array, items: { $ref: '#/components/schemas/Station' } }
  /contracts/{contract}/stations/{number}:
    parameters:
      - $ref: '#/components/parameters/contract'
      - $ref: '#/components/parameters/stationNumber'
    get:
      tags: [Stations et vélos]
      operationId: getStation
      summary: Détail temps réel d'une station
      description: 'Sans `Accept: application/vnd.station.v4+json`, shape legacy avec la liste des vélos (`bikes[]`).'
      x-status: observed
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/vnd.station.v4+json:
              schema: { $ref: '#/components/schemas/Station' }
            application/json:
              schema: { $ref: '#/components/schemas/StationLegacy' }
  /contracts/{contract}/stations/{number}/info:
    parameters:
      - $ref: '#/components/parameters/contract'
      - $ref: '#/components/parameters/stationNumber'
    get:
      tags: [Stations et vélos]
      operationId: getStationInfo
      summary: Infos station (label, code, country, agency, district)
      x-status: live
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  label: { type: string }
                  code: { type: integer }
                  country: { type: integer }
                  agency: { type: integer }
                  district: { type: integer }
  /contracts/{contract}/bikes:
    parameters: [{ $ref: '#/components/parameters/contract' }]
    get:
      tags: [Stations et vélos]
      operationId: listBikes
      summary: Vélos d'une station / un vélo / tout le parc
      description: |
        `?stationNumber=` -> vélos garés dans la station (c'est de là que viennent `bikeNumber`/`standNumber` du
        déverrouillage). `?number=` -> un vélo (tableau à 1 élément). Sans filtre -> **tout le parc** (17 652
        entrées, ~1,3 Mo, tous statuts). Un `User-Agent` littéralement `node` est bloqué par le WAF (403).
        `v4` (site web) est un sur-ensemble de `v3` (app mobile officielle) : mêmes champs, plus
        `lastTripDateTime`, `lastControlDateTime`, `nextCheck`, `lastRevisionDateTime`, `nextReview`,
        `isReserved` et `energySource` (comparé le 24/09/2026).
      x-status: live
      parameters:
        - { name: stationNumber, in: query, schema: { type: integer }, example: 2002 }
        - {
            name: number,
            in: query,
            schema: { type: integer },
            description: Numéro de vélo,
            example: 20449,
          }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: OK
          content:
            application/vnd.bikes.v3+json:
              schema: { type: array, items: { $ref: '#/components/schemas/Bike' } }
            application/vnd.bikes.v4+json:
              schema: { type: array, items: { $ref: '#/components/schemas/Bike' } }
  /contracts/{contract}/bikes/ratings:
    parameters: [{ $ref: '#/components/parameters/contract' }]
    get:
      tags: [Stations et vélos]
      operationId: getBikeRatings
      summary: 'Notes de vélos (exige `Accept: application/vnd.bikes.v4+json`, sinon 415/406)'
      x-status: live
      parameters:
        - { name: id, in: query, schema: { type: string } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: '`[]` observé'
          content:
            application/vnd.bikes.v4+json:
              schema: { type: array, items: { type: object } }

  # ---------------------------------------------------------------- GBFS
  /contracts/{contract}/gbfs/gbfs.json:
    parameters: [{ $ref: '#/components/parameters/contract' }]
    get:
      tags: [Open data (GBFS)]
      operationId: gbfsIndex
      summary: Index GBFS 2.3 (sans authentification)
      security: []
      x-status: live
      responses:
