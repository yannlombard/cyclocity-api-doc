  /contracts/{contract}/accounts/{accountId}/bookings:
    parameters:
      - $ref: '#/components/parameters/contract'
      - $ref: '#/components/parameters/accountId'
    get:
      tags: [Compte]
      operationId: listBookings
      summary: Réservations en cours du compte (`[]` observé)
      description: |
        Capturé sur l'app iOS avec `Accept: */*`, toujours vide. L'app Android croise la liste avec
        `GET /bikes` par `bikeId` : un vélo `RESERVED` absent de la liste est réservé par un autre
        usager, et l'app refuse de le libérer. README § 5.9.
      security: [{ Taknv1: [], Identity: [] }]
      x-status: observed
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenIdentity' }
        '200':
          description: OK
          content:
            application/booking+json:
              schema: { type: array, items: { $ref: '#/components/schemas/Booking' } }
    post:
      tags: [Compte]
      operationId: createBooking
      summary: Réserver un vélo (15 min, 10 points de fidélité)
      description: |
        Lu dans le binaire Android 3.3.10 (`tg/d`, `CreateBooking`, `il/a$a`), jamais exercé : l'appel
        coûte des points et retire le vélo aux autres usagers pendant la durée de la feature
        `bike.booking.duration` (900 s à Lyon). Aucun en-tête déclaré : le corps part en
        `application/json` (Gson), sans `Accept`. Avant l'appel, l'app vérifie le solde
        (`GET .../rewards`) contre le `reward` de l'entrée `BIKE_BOOKING` de
        `GET /rewards/configurations`, puis choisit un abonnement ST ou LT en cours. Pas de route
        d'annulation. README § 5.9.
      security: [{ Taknv1: [], Identity: [] }]
      x-status: decompiled
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBooking' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenIdentity' }
        '200':
          description: La réservation créée
          content:
            application/booking+json:
              schema: { $ref: '#/components/schemas/Booking' }

