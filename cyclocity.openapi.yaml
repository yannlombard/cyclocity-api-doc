      x-status: observed
      parameters:
        - {
            name: periods,
            in: query,
            schema: { type: string },
            description: 'CURRENT, PAST, FUTURE, combinables',
            example: 'PAST,CURRENT,FUTURE',
          }
        - { name: type, in: query, schema: { type: string, enum: [ST, LT, UB, BATTERY, PARKING] } }
        - {
            name: noStatus,
            in: query,
            style: form,
            explode: true,
            schema: { type: array, items: { type: string, enum: [CLOSED, INCOMPLETE_FILE, NOT_VALID_YET] } },
            description: 'Exclut les abonnements portant ce statut (répétable, app 3.6.1)',
          }
