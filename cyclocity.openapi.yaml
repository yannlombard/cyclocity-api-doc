            schema: { type: string, enum: [WEEK, MONTH, YEAR] },
          }
        - name: statsType
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items:
              {
                type: string,
                enum:
                  [
                    TRIPS_COUNTS,
                    TRIPS_COUNTS_MECA,
                    TRIPS_COUNTS_ELEC,
                    TRIPS_DURATIONS,
                    TRIPS_REWARDS,
